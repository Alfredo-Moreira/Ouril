[package]
name = "ouril-sync"
description = "Ouril sync rules: game records, stats derived from records, mutation payloads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ouril-engine = { path = "../engine" }
ouril-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
# Property-based tests (docs/architecture/engine.md "Testing strategy"). No fork/timeout.
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[features]
ts = ["dep:ts-rs", "ouril-engine/ts", "ouril-protocol/ts"]
