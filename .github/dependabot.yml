# Dependabot version updates. Docs: https://docs.github.com/code-security/dependabot
# Only GitHub Actions is enabled now. Uncomment each ecosystem once its folder is
# scaffolded (layout: docs/architecture/monorepo.md); Dependabot errors on missing manifests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

