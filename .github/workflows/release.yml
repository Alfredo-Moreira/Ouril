name: Release

on:
  push:
    branches:
      - main

# Creating a tag and a GitHub release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  release-on-push:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: release
        uses: rymndhng/release-on-push-action@master
        with:
          bump_version_scheme: minor
          tag_prefix: v
          use_github_release_notes: true
          release_name: "Ouril <RELEASE_VERSION>"
