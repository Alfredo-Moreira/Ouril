# Deploy Ouril to Vercel: the web app and the server, as two services of one project (ADR 0030).
# - web: the static site. Vercel's build image has no Rust toolchain, so the WASM engine and the
#   site are built here (the same toolbox image as CI and local development, ADR 0017) and
#   uploaded as finished files.
# - api: the Rust server (apps/server) as a container service. Vercel builds it from
#   apps/server/Dockerfile.vercel during the deploy and serves /v1 from it, on the same origin.
# Production deploys run after CI passes on main, or by hand. A manual run can also make a
# preview deployment (its own URL, production untouched; no migrations, sign-in won't work there).
#
# Setup (once, see docs/architecture/deployment.md): the repository secrets VERCEL_TOKEN,
# VERCEL_ORG_ID and VERCEL_PROJECT_ID, and in the `production` environment the secrets
# DATABASE_URL (Neon's direct connection string, ADR 0027), JWT_SECRET (`openssl rand -base64 48`)
# and GOOGLE_CLIENT_ID. Until VERCEL_TOKEN exists, this workflow skips the deploy.
# The live-game relay on the homelab (ADR 0032, 0033) is optional: the variable RELAY_URL
# (https://ouril-live.moreiralabs.org) and the secrets RELAY_API_KEY and RELAY_TOKEN_SECRET (the
# same values as deploy/homelab/.env). Without all three, live games work by polling.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: production, or preview (a separate URL; production untouched)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Vercel (${{ inputs.target || 'production' }})
    # Only after a green CI run on main (or a manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ inputs.target || 'production' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Server settings, passed to the deployment as runtime environment variables.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://ouril.vercel.app' }}
      RELAY_URL: ${{ vars.RELAY_URL }}
      RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
      RELAY_TOKEN_SECRET: ${{ secrets.RELAY_TOKEN_SECRET }}
    steps:
      - name: Check the setup
        id: setup
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set: skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in DATABASE_URL JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret to the production environment (deployment.md)."
              exit 1
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          # The commit CI just verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
        if: steps.setup.outputs.ready == 'true'
      - name: Build the toolbox image (cached)
        if: steps.setup.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/toolbox.Dockerfile
          tags: ouril-toolbox:latest
          load: true
          cache-from: type=gha,scope=toolbox
      - name: Build the WASM engine
        if: steps.setup.outputs.ready == 'true'
        run: |
          cp .env.example .env
          docker compose run --rm toolbox wasm-pack build core/wasm --target web --out-dir pkg --out-name ouril_wasm --release
          docker compose run --rm toolbox wasm-opt -Oz --strip-debug core/wasm/pkg/ouril_wasm_bg.wasm -o core/wasm/pkg/ouril_wasm_bg.wasm
      - name: Build the site
        if: steps.setup.outputs.ready == 'true'
        env:
          # Usage statistics (ADR 0026), sent only after the player opts in (ADR 0014). Repository
          # variables of the same name override these. The CSP in vercel.json must allow the host.
          VITE_MATOMO_URL: ${{ vars.VITE_MATOMO_URL || 'https://analytics.moreiralabs.org/' }}
          VITE_MATOMO_SITE_ID: ${{ vars.VITE_MATOMO_SITE_ID || '1' }}
          # Accounts and sync (deployment.md, "Switching accounts on"): off until the variables
          # VITE_FEATURE_ACCOUNTS / VITE_FEATURE_STATS are "true". The API is served on the same
          # origin (/v1, ADR 0030), so VITE_API_BASE_URL stays empty unless the API moves.
          VITE_FEATURE_ACCOUNTS: ${{ vars.VITE_FEATURE_ACCOUNTS || 'false' }}
          VITE_FEATURE_STATS: ${{ vars.VITE_FEATURE_STATS || 'false' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
        run: |
          # The container runs as root: hand dist/ back to the runner's user ($(id -u) expands
          # on the host) so the steps below can write to it.
          docker compose run --rm -e VITE_MATOMO_URL -e VITE_MATOMO_SITE_ID \
            -e VITE_FEATURE_ACCOUNTS -e VITE_FEATURE_STATS -e VITE_API_BASE_URL \
            -e VITE_GOOGLE_CLIENT_ID web sh -c "pnpm install --frozen-lockfile && pnpm --filter web build && chown -R $(id -u):$(id -g) apps/web/dist"
      - name: Migrate the database
        if: steps.setup.outputs.ready == 'true' && env.TARGET == 'production'
        run: |
          # Refuse a read-only database (the Neon read replica's URL, ADR 0027): the server
          # would start but every write would fail.
          ro=$(docker run --rm -e DATABASE_URL postgres:18 sh -c \
            'psql "$DATABASE_URL" -tAc "SELECT pg_is_in_recovery() OR current_setting('"'"'transaction_read_only'"'"') = '"'"'on'"'"'"')
          if [ "$ro" != f ]; then
            echo "::error::DATABASE_URL is read-only or unreachable (got '$ro'): use the primary compute's connection string."
            exit 1
          fi
          # Forward-only, embedded in the server too (backend.md, "Migrations").
          docker compose run --rm -e DATABASE_URL toolbox sqlx migrate run --source apps/server/migrations
      - name: Assemble the deployment
        if: steps.setup.outputs.ready == 'true'
        run: |
          # out/vercel.json: the two services and the routing. out/web: the site.
          # out/api: the Rust workspace the container build needs (no target/, no web). Cargo
          # loads every workspace member even to build one crate, so each member's sources
          # must be here (the relay only for its manifest: it isn't built or deployed here).
          mkdir -p out/api/apps
          cp apps/web/vercel.json out/vercel.json
          cp -R apps/web/dist out/web
          cp Cargo.toml Cargo.lock out/api/
          rsync -a --exclude target --exclude 'wasm/pkg' core out/api/
          rsync -a --exclude target apps/server apps/relay out/api/apps/
          cp apps/server/Dockerfile.vercel out/api/Dockerfile.vercel
          du -sh out/web out/api
      - name: The assembled workspace loads (every member present, lockfile in step)
        if: steps.setup.outputs.ready == 'true'
        # Fails here, with cargo's message, instead of inside Vercel's image build.
        run: >-
          docker compose run --rm toolbox
          cargo metadata --no-deps --offline --locked --format-version 1
          --manifest-path out/api/Cargo.toml > /dev/null
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        run: |
          prod=()
          if [ "$TARGET" = production ]; then prod=(--prod); fi
          url=$(npx --yes vercel@latest deploy out "${prod[@]}" --yes --token "$VERCEL_TOKEN" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env JWT_SECRET="$JWT_SECRET" \
            --env GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --env ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            --env RELAY_URL="$RELAY_URL" \
            --env RELAY_API_KEY="$RELAY_API_KEY" \
            --env RELAY_TOKEN_SECRET="$RELAY_TOKEN_SECRET" \
            --env CLIENT_IP_HEADER=x-real-ip \
            --env PORT=8080 \
            --env LOG_FORMAT=json \
            --env RUST_LOG=info)
          echo "Deployed ($TARGET): $url" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Check: $url/readyz should say ok, and $url/v1/meta should return JSON." >> "$GITHUB_STEP_SUMMARY"
