# CI for the Rust core, the server and the web app (ADR 0017: the same toolbox image as local
# development). Every job is read-only towards the repo; nothing is deployed from here
# (deploy-web.yml deploys the web app and the server after CI passes on main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs check (links, structure, ADR index, variant catalog)
        run: python3 .claude/skills/docs-audit/scripts/check_docs.py .
      - name: Test vector bookkeeping check
        run: python3 .claude/skills/test-vectors/scripts/check_vectors.py .
      - name: vercel.json against Vercel's schema
        # Vercel rejects an invalid vercel.json only at deploy time (ADR 0030).
        run: |
          pip install --quiet jsonschema
          curl -fsSL https://openapi.vercel.sh/vercel.json -o "$RUNNER_TEMP/vercel-schema.json"
          python3 - "$RUNNER_TEMP/vercel-schema.json" apps/web/vercel.json <<'EOF'
          import json, sys
          import jsonschema
          schema, config = (json.load(open(p)) for p in sys.argv[1:3])
          errors = list(jsonschema.Draft7Validator(schema).iter_errors(config))
          for e in errors:
              print(f"::error file=apps/web/vercel.json::{list(e.path)}: {e.message}")
          sys.exit(1 if errors else 0)
          EOF

  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the toolbox image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/toolbox.Dockerfile
          tags: ouril-toolbox:latest
          load: true
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox
      - name: Prepare .env and start Postgres
        run: |
          cp .env.example .env
          docker compose up -d --wait db
      - name: Format
        run: docker compose run --rm toolbox cargo fmt --all -- --check
      - name: Clippy (all features)
        run: docker compose run --rm toolbox cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (all features, incl. the 17+ rule test vectors)
        run: docker compose run --rm toolbox cargo test --workspace --all-features
      - name: Server tests without dev-auth (proves /v1/auth/dev is absent)
        run: docker compose run --rm toolbox cargo test -p ouril-server
      - name: Dependency audit (RustSec)
        run: docker compose run --rm toolbox sh -c "cargo binstall -y --locked cargo-audit && cargo audit"

  web:
    name: WASM and web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the toolbox image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/toolbox.Dockerfile
          tags: ouril-toolbox:latest
          load: true
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox
      - name: Build the WASM engine (wasm-pack + wasm-opt)
        run: |
          cp .env.example .env
          docker compose run --rm toolbox wasm-pack build core/wasm --target web --out-dir pkg --out-name ouril_wasm --release
          docker compose run --rm toolbox wasm-opt -Oz --strip-debug core/wasm/pkg/ouril_wasm_bg.wasm -o core/wasm/pkg/ouril_wasm_bg.wasm
      - name: Web checks
        run: >
          docker compose run --rm web sh -c
          "pnpm install --frozen-lockfile
          && pnpm --filter web lint
          && pnpm --filter web typecheck
          && pnpm --filter web format:check
          && pnpm --filter web test
          && pnpm --filter web build"
      - name: Dependency audit (npm, high and critical)
        run: docker compose run --rm web pnpm audit --prod --audit-level high

  release-image:
    name: Release server image (no dev-auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          tags: ouril-server:ci
          load: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: The release binary has no dev sign-in route
        run: |
          id=$(docker create ouril-server:ci)
          docker cp "$id:/usr/local/bin/ouril-server" ./ouril-server
          docker rm "$id"
          if grep -a -q "/auth/dev" ./ouril-server; then
            echo "::error::release binary contains the dev-auth route"
            exit 1
          fi

  homelab:
    name: Homelab images (relay, jobs; built, never pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compose file is valid
        run: docker compose -f deploy/homelab/docker-compose.homelab.yml config --quiet
      - name: Shellcheck the build script
        run: shellcheck deploy/homelab/build-and-push.sh
      # Both architectures, cross-compiled like the real build (the NAS is arm64). Images go to
      # the private registry only through deploy/homelab/build-and-push.sh, never from CI.
      - name: Build the relay image (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/homelab/Dockerfile
          build-contexts: homelab=deploy/homelab
          build-args: PACKAGE=ouril-relay
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - name: Build the jobs image (amd64 and arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/homelab/Dockerfile
          build-contexts: homelab=deploy/homelab
          build-args: PACKAGE=ouril-jobs
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs
      - name: Load the amd64 images to boot them
        run: |
          for p in ouril-relay ouril-jobs; do
            docker buildx build --load --platform linux/amd64 -f deploy/homelab/Dockerfile \
              --build-context homelab=deploy/homelab --build-arg PACKAGE=$p \
              --cache-from type=gha,scope=${p#ouril-} -t $p:ci .
          done
      - name: Relay boots read-only, non-root, healthy
        run: |
          docker run -d --name relay --read-only --cap-drop ALL -p 127.0.0.1:8090:8090 \
            -e RELAY_API_KEY="$(openssl rand -hex 32)" \
            -e RELAY_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e ALLOWED_ORIGINS=https://ouril.vercel.app \
            ouril-relay:ci
          for _ in $(seq 1 20); do curl -sf localhost:8090/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/admin)" = 404
          docker exec relay /service healthcheck
          test "$(docker inspect relay --format '{{.Config.User}}')" != ""
          docker rm -f relay >/dev/null
      - name: Jobs refuses to start without its settings, and is unhealthy before a round
        run: |
          if docker run --rm ouril-jobs:ci > /tmp/jobs.log 2>&1; then
            echo "::error::ouril-jobs started without JOBS_URL"; exit 1
          fi
          grep -q "JOBS_URL is required" /tmp/jobs.log
          if docker run --rm -e JOBS_URL=https://example.invalid -e JOBS_TOKEN="$(openssl rand -hex 32)" \
              ouril-jobs:ci healthcheck; then
            echo "::error::healthy before any round"; exit 1
          fi
      - name: CI images hold no .env (CI has no deploy/homelab/.env)
        run: |
          for p in ouril-relay ouril-jobs; do
            id=$(docker create $p:ci)
            if docker cp "$id:/app/.env" /tmp/leaked.env 2>/dev/null; then
              echo "::error::$p contains a .env"; exit 1
            fi
            docker rm "$id" >/dev/null
          done
