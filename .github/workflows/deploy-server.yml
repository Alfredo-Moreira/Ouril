# Deploy the Rust server (apps/server) to production on Fly.io (ADR 0019, ADR 0028: there is no
# staging; local Docker plays that role). Run by hand with a release tag (vX.Y.Z, created by
# release.yml on every merge to main); it deploys only if CI passed on that tag's commit. Tags
# pushed by release.yml use GITHUB_TOKEN, which can't trigger workflows, so a deploy is a
# deliberate promotion.
#
# Fly builds the image from apps/server/Dockerfile on its remote builder (never with dev-auth;
# CI's release-image job checks the same Dockerfile). Migrations run as the release command
# (`ouril-server migrate`) before new machines take traffic.
#
# No local flyctl needed: this workflow creates the Fly app on its first run, copies DATABASE_URL
# into Fly's secrets, and generates JWT_SECRET once (never replaced, so sessions survive deploys).
#
# Setup (once, see docs/architecture/deployment.md): in the GitHub environment production (shared
# with deploy-web.yml), add the secrets FLY_API_TOKEN (an org token from the Fly dashboard, which
# can create the app) and DATABASE_URL (Neon's direct connection string, ADR 0027). Optional
# settings: the variable FLY_ORG, the Fly organization slug (default "personal"); GOOGLE_CLIENT_ID
# (a secret or a variable), the Google OAuth client ID, copied to Fly so Google sign-in is on
# (unset = 501).
name: Deploy server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v0.5.0
        type: string
        required: true

permissions:
  contents: read
  actions: read # check that CI passed on the commit

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to production
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      TAG: ${{ inputs.tag }}
      CONFIG: apps/server/fly.toml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the inputs
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the FLY_API_TOKEN secret to the production environment."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Deploy a release tag such as v0.5.0 (got '$TAG')."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Require a green CI run on this commit
        run: |
          sha=$(git rev-parse HEAD)
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" \
            --status success --limit 1 --json databaseId --jq 'length')
          if [ "$ok" != 1 ]; then
            echo "::error::CI hasn't passed on $sha: not deploying."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app and its secrets if missing
        run: |
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' "$CONFIG")
          if ! flyctl apps list --org "$FLY_ORG" --json \
            | jq -e --arg app "$app" 'any(.[]; (.Name // .name) == $app)' > /dev/null; then
            echo "Creating the Fly app $app in organization $FLY_ORG."
            flyctl apps create "$app" --org "$FLY_ORG"
          fi
          existing=$(flyctl secrets list --app "$app" --json | jq -r '.[] | (.Name // .name)')
          # DATABASE_URL: GitHub is the source of truth, so changing it there updates Fly.
          if [ -n "$DATABASE_URL" ]; then
            flyctl secrets set --app "$app" --stage "DATABASE_URL=$DATABASE_URL" > /dev/null
          elif ! printf '%s\n' "$existing" | grep -qx DATABASE_URL; then
            echo "::error::Add the DATABASE_URL secret (Neon's direct connection string) to the production environment."
            exit 1
          fi
          # GOOGLE_CLIENT_ID: from GitHub (secret or variable); unset leaves Google sign-in off.
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            flyctl secrets set --app "$app" --stage "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" > /dev/null
          fi
          # JWT_SECRET: generated once. Replacing it would sign every player out.
          if ! printf '%s\n' "$existing" | grep -qx JWT_SECRET; then
            jwt=$(openssl rand -base64 48)
            echo "::add-mask::$jwt"
            flyctl secrets set --app "$app" --stage "JWT_SECRET=$jwt" > /dev/null
            echo "Generated JWT_SECRET for $app."
          fi
      - name: Deploy
        run: flyctl deploy --config "$CONFIG" --dockerfile apps/server/Dockerfile --remote-only .
