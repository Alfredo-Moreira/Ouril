# Opt-in override for LAN testing (e.g. a phone hitting Vite on your machine's IP).
#   docker compose -f compose.yaml -f docker/compose.lan.yaml up db server web
# Exposes web and the dev server (which has dev-auth: anyone on the network can sign in)
# on all host interfaces. Postgres stays on loopback. Use only on trusted networks.
# Add http://<your-ip>:5173 to ALLOWED_ORIGINS in .env, or the server answers sign-in with
# 403 "origin not allowed".
services:
  server:
    ports: !override
      - "${SERVER_PORT:-8080}:8080"
  web:
    ports: !override
      - "${WEB_PORT:-5173}:5173"
