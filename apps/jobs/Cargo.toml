[package]
name = "ouril-jobs"
description = "Ouril scheduled jobs (ADR 0032): calls the server's job endpoints on a schedule. Runs on the homelab."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Blocking HTTPS with rustls on ring (no cmake; cross-compiles with the homelab image's linkers).
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
